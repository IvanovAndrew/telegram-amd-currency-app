<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- 1. Запрещаем масштаб и скролл всей страницы браузера для нативного ощущения -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <title>telegram-currency-app</title>

    <!-- 2. Подключаем Telegram Web App SDK (ОБЯЗАТЕЛЬНО до загрузки вашего скрипта) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      /* 3. Базовая адаптация под тему Telegram и запрет лишних жестов */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; /* Предотвращает "резиновый" скролл на iOS */
        background-color: var(--tg-theme-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #000000);
        -webkit-tap-highlight-color: transparent; /* Убирает синюю вспышку при клике на мобильных */
        user-select: none; /* Запрещает случайное выделение текста */
      }

      #root {
        height: 100%;
        overflow-y: auto; /* Скроллится только внутреннее содержимое App, а не вся страница */
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
